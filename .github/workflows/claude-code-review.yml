name: Claude Code Review (reusable)

# Reusable workflow. Call it from another repo's caller workflow with `uses:`; the caller owns the
# trigger (e.g. `on: pull_request`) and passes the CLAUDE_CODE_OAUTH_TOKEN secret. This file has only
# a `workflow_call` trigger, so it never runs on its own in this hub repo.
#
# Inside a called workflow the `github` context is the CALLER's, so `github.repository` and
# `github.event.pull_request.number` resolve to the caller's PR, and `actions/checkout` checks out the
# caller's code (its CLAUDE.md + diff).
on:
  workflow_call:
    inputs:
      model:
        description: Top-level driver model for the review (the code-review command still spawns Opus bug subagents internally).
        type: string
        required: false
        default: claude-opus-5-5
      runs-on:
        description: Runner label to execute on (e.g. a self-hosted runner's label).
        type: string
        required: false
        default: ubuntu-latest
      # claude-code-action hard-fails on bot-initiated workflows unless the bot is allow-listed.
      # Callers whose issue-worker opens PRs as a GitHub App pass that app's slug here so those
      # PRs still get reviewed; the empty default keeps every other bot rejected.
      allowed-bots:
        description: Comma-separated bot logins (without the [bot] suffix) allowed to trigger the review.
        type: string
        required: false
        default: ''
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  claude-review:
    runs-on: ${{ inputs.runs-on }}
    # Job-level on purpose: workflow-level concurrency is ignored in called reusable workflows.
    # Groups by caller PR so a new push cancels the still-running review of the stale commit;
    # runs (and their groups) live in the caller repo, so callers don't collide with each other.
    concurrency:
      group: claude-code-review-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: ${{ inputs.allowed-bots }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # --comment posts the review to the PR; the inline-comment tool in --allowedTools is what
          # makes the action start the github_inline_comment MCP server (otherwise it falls back to a
          # single top-level comment). The gh commands are the ones the code-review command reads and
          # comments with. In CI nobody can approve a prompt, so a command missing here is denied,
          # and the command's own `allowed-tools` frontmatter has not been enough to prevent that.
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: |
            --model ${{ inputs.model }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*)"

      # The action succeeds whenever the agent ends without an error, and a denied tool call is not
      # one: a review that never read the PR still showed a green check. A working review can be
      # denied a stray call, and a PR Claude already reviewed gets no new comment, so the job fails
      # only when the run errored, or was denied tools and posted nothing. Only the final result
      # object carries the outcome, as in issue-worker's guard.
      - name: Fail if the review was blocked
        if: steps.claude-review.outputs.execution_file != ''
        run: |
          f="${{ steps.claude-review.outputs.execution_file }}"
          jq -r '[.. | objects | select(.type == "result")] | last | .permission_denials // [] | .[] | "denied: \(.tool_name) \(.tool_input.command // "")"' "$f"
          if jq -e '[.. | objects | select(.type == "result")] | last | .is_error == true' "$f" > /dev/null; then
            echo "::error::The review errored"
            exit 1
          fi
          denied=$(jq '[.. | objects | select(.type == "result")] | last | ((.permission_denials // []) | length) + (.permission_denials_count // 0)' "$f")
          posted=$(jq '[.. | objects | select(.type == "tool_result" and (.is_error | not)) | .tool_use_id] as $ok
            | [.. | objects | select(.type == "tool_use")
               | select(.name == "mcp__github_inline_comment__create_inline_comment"
                        or (.name == "Bash" and ((.input.command // "") | startswith("gh pr comment"))))
               | select(.id as $id | any($ok[]; . == $id))]
            | length' "$f")
          if [ "$denied" -gt 0 ] && [ "$posted" -eq 0 ]; then
            echo "::error::The review was denied $denied tool calls and posted nothing, so it did not review this PR"
            exit 1
          fi
